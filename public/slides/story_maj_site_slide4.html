<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>story_maj_site_slide4 — CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 200px 100px 160px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .slide > * { position: relative; z-index: 1; }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .logo { font-size: 36px; font-weight: 800; color: #7C3AED; letter-spacing: 1.5px; }
  .slide-num { font-size: 28px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.5px; }

  .s-title {
    font-size: 68px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    letter-spacing: -1.5px;
    line-height: 1.18;
    max-width: 780px;
    margin-bottom: 64px;
  }

  .cta-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #7C3AED;
    border-radius: 999px;
    padding: 30px 56px;
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.3px;
    box-shadow: 0 20px 60px rgba(124,58,237,0.4);
  }

  .cta-hint {
    margin-top: 26px;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
  }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide4">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <div class="header">
      <div class="logo">FINANCIA</div>
      <div class="slide-num">4/4</div>
    </div>

    <h2 class="s-title">Va checker ça 👀</h2>

    <div class="cta-btn">🔗 financia.cloud</div>
    <div class="cta-hint">(lien en story)</div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
