<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>story_actu4_slide2 — Les chiffres du trimestre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  /* Centers and scales the fixed 1080x1920 canvas to fit any real screen */
  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 120px 90px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  /* Stylized upward arrow, decorative background */
  .bg-arrow {
    position: absolute;
    z-index: 0;
    pointer-events: none;
  }

  .slide > * { position: relative; z-index: 1; }

  /* Header */
  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .logo {
    font-size: 36px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 1.5px;
  }
  .slide-num {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  /* Slide 2 content */
  .s-title {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -2px;
    line-height: 1.12;
    margin-bottom: 68px;
  }

  .stat-rows { width: 100%; display: flex; flex-direction: column; gap: 0; }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .stat-row:first-child { border-top: 1px solid rgba(255,255,255,0.1); }
  .stat-label {
    font-size: 40px;
    font-weight: 600;
    color: rgba(255,255,255,0.78);
  }
  .stat-val {
    font-size: 52px;
    font-weight: 800;
    color: #7C3AED;
  }

  .note-badge {
    margin-top: 60px;
    width: 100%;
    background: rgba(124,58,237,0.1);
    border: 1.5px solid rgba(124,58,237,0.4);
    border-radius: 20px;
    padding: 34px 40px;
    font-size: 36px;
    font-weight: 600;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.45;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide2">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <!-- Stylized upward arrow behind content -->
    <svg class="bg-arrow" width="820" height="900" viewBox="0 0 820 900" style="left:130px; top:520px;">
      <polyline points="20,860 220,640 380,740 620,340 800,60"
        fill="none" stroke="#7C3AED" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
      <polygon points="800,60 715,95 785,175" fill="#7C3AED" opacity="0.5"/>
    </svg>

    <div class="header">
      <div class="logo">FINANCIA</div>
      <div class="slide-num">2/4</div>
    </div>

    <p class="s-title">Les chiffres<br>du trimestre</p>

    <div class="stat-rows">
      <div class="stat-row">
        <span class="stat-label">S&amp;P 500</span>
        <span class="stat-val">+14%</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Nasdaq</span>
        <span class="stat-val">+20%</span>
      </div>
    </div>
    <p style="font-size:32px; font-weight:500; color:rgba(255,255,255,0.4); margin-top:16px;">depuis mars 2026</p>

    <div class="note-badge">🌍 Pendant ce temps : conflit en Iran, tensions géopolitiques</div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
