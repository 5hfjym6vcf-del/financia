<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>carousel_jeunesinvest_slide1 — Hook</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 110px 90px;
  }

  .slide-num {
    position: absolute;
    top: 56px;
    right: 64px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 46px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
  }
  .footer-logo { font-size: 22px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 2px; }
  .footer-logo .handle { color: rgba(255,255,255,0.3); font-weight: 600; letter-spacing: 0.3px; margin-left: 10px; }
  .footer-source { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.28); }

  .hook-title {
    font-size: 58px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.32;
    letter-spacing: -1px;
    max-width: 780px;
  }
  .accent-u { position: relative; display: inline-block; }
  .accent-u::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -12px;
    height: 8px;
    background: #7C3AED;
    border-radius: 6px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide1">
    <div class="slide-num">1/6</div>

    <h1 class="hook-title">Les jeunes investissent-ils<br><span class="accent-u">vraiment plus ?</span></h1>

    <div class="footer">
      <div class="footer-logo">FINANCIA</div>
      <div class="footer-source">Source : AMF, 2025</div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
