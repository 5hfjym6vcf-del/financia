<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>carousel_jeunesinvest_slide2 — Part des investisseurs actifs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 110px 90px;
  }

  .slide-num {
    position: absolute;
    top: 56px;
    right: 64px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 46px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
  }
  .footer-logo { font-size: 22px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 2px; }
  .footer-logo .handle { color: rgba(255,255,255,0.3); font-weight: 600; letter-spacing: 0.3px; margin-left: 10px; }
  .footer-source { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.28); }

  .title {
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.28;
    letter-spacing: -0.8px;
    max-width: 820px;
    margin-bottom: 72px;
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 76px;
    height: 380px;
    width: 100%;
  }
  .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-value { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 16px; white-space: nowrap; }
  .bar { width: 128px; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, #9457f0 0%, #7C3AED 100%); }
  .chart-baseline { width: 100%; max-width: 700px; height: 2px; background: rgba(255,255,255,0.15); margin-top: -2px; }
  .bar-labels { display: flex; justify-content: center; gap: 76px; width: 100%; margin-top: 22px; }
  .bar-label { width: 128px; text-align: center; font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.55); }
  .bar-label span { display: block; font-size: 16px; color: rgba(255,255,255,0.32); margin-top: 4px; font-weight: 500; }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide2">
    <div class="slide-num">2/6</div>

    <h2 class="title">Part des investisseurs<br>actifs en France</h2>

    <div class="chart-bars">
      <div class="bar-col">
        <div class="bar-value">2,1%</div>
        <div class="bar" style="height:262px;"></div>
      </div>
      <div class="bar-col">
        <div class="bar-value">2,5%</div>
        <div class="bar" style="height:312px;"></div>
      </div>
      <div class="bar-col">
        <div class="bar-value">3,1%</div>
        <div class="bar" style="height:380px;"></div>
      </div>
    </div>
    <div class="chart-baseline"></div>
    <div class="bar-labels">
      <div class="bar-label">2022</div>
      <div class="bar-label">2024</div>
      <div class="bar-label">2024<span>+24 ans</span></div>
    </div>

    <div class="footer">
      <div class="footer-logo">FINANCIA</div>
      <div class="footer-source">Source : AMF, 2025</div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
