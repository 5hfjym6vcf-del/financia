<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#000;font-family:'Montserrat',sans-serif}
  .carte{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 22% 12%,#1a1030 0%,#000 62%);
    display:flex;flex-direction:column;justify-content:center;padding:0 86px}
  .grille{position:absolute;inset:0;
    background-image:linear-gradient(rgba(124,58,237,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(124,58,237,.07) 1px,transparent 1px);
    background-size:60px 60px}
  .contenu{position:relative}
  .logo{font-size:40px;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:38px}
  .logo span{color:#7C3AED}
  h1{font-size:74px;font-weight:800;line-height:1.06;letter-spacing:-.028em;color:#fff}
  h1 em{color:#A78BFA;font-style:normal}
  .lead{margin-top:26px;font-size:29px;font-weight:500;line-height:1.45;color:rgba(255,255,255,.68);max-width:900px}
  .pied{position:absolute;bottom:56px;left:86px;right:86px;display:flex;
    align-items:center;justify-content:space-between}
  .url{font-size:26px;font-weight:700;color:#A78BFA}
  .tags{font-size:22px;font-weight:600;color:rgba(255,255,255,.42)}
</style></head>
<body><div class="carte"><div class="grille"></div>
  <div class="contenu">
    <div class="logo">Financi<span>a</span></div>
    <h1>Apprendre à investir,<br><em>sans jargon et sans conseil</em></h1>
    <p class="lead">Comparateur d'épargne, simulateur PEA, marchés en direct. Gratuit, pour les 18-30 ans.</p>
  </div>
  <div class="pied"><div class="url">financia.cloud</div><div class="tags">0 % conseil personnalisé</div></div>
</div></body></html>
