<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>temoignage2_slide1 — Aisultan, étudiant à emlyon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  /* Centers and scales the fixed 1080x1920 canvas to fit any real screen */
  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 90px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .slide > * { position: relative; z-index: 1; }

  /* Header — logo + "TÉMOIGNAGE" badge (left), slide count (right) */
  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    z-index: 2;
  }
  .header-left { display: flex; flex-direction: column; gap: 14px; }
  .logo {
    font-size: 36px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 1.5px;
  }
  .badge-temoignage {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    background: rgba(124,58,237,0.12);
    border: 1.5px solid rgba(124,58,237,0.45);
    border-radius: 100px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .slide-num {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  /* Signature visual: big stylized violet quote mark */
  .quote-mark {
    font-size: 220px;
    font-weight: 900;
    color: #7C3AED;
    line-height: 0.5;
    margin-bottom: 8px;
    text-align: center;
  }

  .hook-quote {
    font-size: 56px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.38;
    letter-spacing: -1px;
    max-width: 860px;
    margin-bottom: 56px;
  }

  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .profile-name {
    font-size: 38px;
    font-weight: 800;
    color: #7C3AED;
  }
  .profile-status {
    font-size: 32px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
  }

</style>
</head>
<body>

<!-- ============================================================
     CONTENU DU TÉMOIGNAGE — modifier uniquement ce bloc pour créer
     un nouveau témoignage (même bloc à recopier dans les 3 slides).
     ============================================================ -->
<script>
  const CONTENT = {
    number: 2,
    totalSlides: 3,
    name: "Aisultan",
    status: "étudiant à emlyon",
    hookQuote: "Je me suis formé seul, en dehors des amphis — livres, podcasts, et surtout la pratique.",
    parcoursTitle: "Son parcours",
    paragraphs: [
      "Après une prépa, j’ai développé ma culture financière en autodidacte : livres spécialisés, podcasts, formats YouTube de décryptage.",
      "J’ai vite voulu lier la théorie à la pratique : j’ai ouvert un PEA et mis en place une stratégie long terme, basée sur du DCA et des ETF.",
      "Une démarche exigeante, mais qui a payé : aujourd’hui l’investissement fait partie de mon quotidien.",
    ],
    lessonTitle: "Ce qui a fait la différence",
    lessonQuote: "La régularité plus que la performance. Le DCA, ça veut juste dire investir un peu, tout le temps, sans essayer de deviner le bon moment.",
    ctaText: "Ton parcours mérite d’être raconté ? Écris-nous en DM 💬",
    followText: "Suis @financia_cloud",
    disclaimer: "Ceci n’est pas un conseil en investissement",
  };
</script>

<div class="stage">
  <div class="slide" id="slide1">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <div class="header">
      <div class="header-left">
        <div class="logo">FINANCIA</div>
        <div class="badge-temoignage" id="badgeNum">TÉMOIGNAGE</div>
      </div>
      <div class="slide-num" id="slideNum">1/3</div>
    </div>

    <div class="quote-mark">&ldquo;</div>
    <p class="hook-quote" id="hookQuote"></p>

    <div class="profile">
      <div class="profile-name" id="profileName"></div>
      <div class="profile-status" id="profileStatus"></div>
    </div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  var SLIDE_INDEX = 1; // position de CE fichier dans la story (1, 2, 3...)
  document.getElementById('badgeNum').textContent = 'TÉMOIGNAGE #' + CONTENT.number;
  document.getElementById('slideNum').textContent = SLIDE_INDEX + '/' + CONTENT.totalSlides;
  document.getElementById('hookQuote').textContent = CONTENT.hookQuote;
  document.getElementById('profileName').textContent = CONTENT.name + ',';
  document.getElementById('profileStatus').textContent = CONTENT.status;

  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
