<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>temoignages_intro — Nouvelle rubrique Témoignages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  /* Centers and scales the fixed 1080x1920 canvas to fit any real screen */
  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 90px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .slide > * { position: relative; z-index: 1; }

  /* Header — logo + "NOUVELLE RUBRIQUE" badge */
  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 2;
  }
  .logo {
    font-size: 36px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 1.5px;
  }
  .badge-rubrique {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    background: rgba(124,58,237,0.12);
    border: 1.5px solid rgba(124,58,237,0.45);
    border-radius: 100px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  /* Signature visual: big stylized violet quote mark */
  .quote-mark {
    font-size: 200px;
    font-weight: 900;
    color: #7C3AED;
    line-height: 0.5;
    margin-bottom: 24px;
    text-align: center;
  }

  h1 {
    font-size: 84px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 28px;
  }

  .subtitle {
    font-size: 42px;
    font-weight: 600;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.4;
    max-width: 780px;
    margin-bottom: 64px;
  }

  .intro-body { display: flex; flex-direction: column; gap: 40px; margin-bottom: 72px; }
  .intro-text {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    text-align: center;
    line-height: 1.5;
    max-width: 840px;
  }

  .cta-badge {
    width: 100%;
    background: rgba(124,58,237,0.18);
    border: 1.5px solid rgba(124,58,237,0.5);
    border-radius: 24px;
    padding: 40px 44px;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.45;
  }

</style>
</head>
<body>

<!-- ============================================================
     CONTENU — modifier ce bloc pour ajuster les textes de la slide
     d'intro (badge, titre, sous-titre, paragraphes, CTA).
     ============================================================ -->
<script>
  const CONTENT = {
    badge: "Nouvelle rubrique",
    title: "Témoignages 💬",
    subtitle: "Comment on apprend vraiment à investir ?",
    paragraphs: [
      "Des jeunes racontent leur parcours : comment ils ont découvert l’investissement, comment ils se sont formés, leurs erreurs de débutant.",
      "Des parcours réels. Sans filtre, sans conseil miracle.",
    ],
    cta: "Ton parcours mérite d’être raconté ? Écris-nous en DM.",
  };
</script>

<div class="stage">
  <div class="slide" id="slide1">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <div class="header">
      <div class="logo">FINANCIA</div>
      <div class="badge-rubrique" id="badgeLabel"></div>
    </div>

    <div class="quote-mark">&ldquo;</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="intro-body" id="introBody"></div>

    <div class="cta-badge" id="ctaText"></div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  document.getElementById('badgeLabel').textContent = CONTENT.badge;
  document.getElementById('title').textContent = CONTENT.title;
  document.getElementById('subtitle').textContent = CONTENT.subtitle;
  document.getElementById('ctaText').textContent = CONTENT.cta;

  var body = document.getElementById('introBody');
  CONTENT.paragraphs.forEach(function (text) {
    var p = document.createElement('p');
    p.className = 'intro-text';
    p.textContent = text;
    body.appendChild(p);
  });

  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
