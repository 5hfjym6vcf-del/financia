<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>temoignage_fondateur_slide2 — Son parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px 90px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .slide > * { position: relative; z-index: 1; }

  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    z-index: 2;
  }
  .header-left { display: flex; flex-direction: column; gap: 14px; }
  .logo {
    font-size: 36px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 1.5px;
  }
  .badge-temoignage {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    background: rgba(124,58,237,0.12);
    border: 1.5px solid rgba(124,58,237,0.45);
    border-radius: 100px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }
  .slide-num {
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  .s-title {
    font-size: 66px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1.6px;
    line-height: 1.14;
    margin-bottom: 72px;
  }

  /* Three airy paragraph blocks, separated by generous gap + a thin
     violet accent bar to mark each new beat of the story. */
  .parcours-list { display: flex; flex-direction: column; gap: 56px; }
  .parcours-item {
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }
  .parcours-bar {
    width: 6px;
    min-height: 100%;
    align-self: stretch;
    background: #7C3AED;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .parcours-text {
    font-size: 42px;
    font-weight: 500;
    color: rgba(255,255,255,0.84);
    line-height: 1.5;
  }

</style>
</head>
<body>

<!-- ============================================================
     CONTENU DU TÉMOIGNAGE — modifier uniquement ce bloc pour créer
     un nouveau témoignage (même bloc à recopier dans les 3 slides).
     ============================================================ -->
<script>
  const CONTENT = {
    badge: "Témoignage — Le fondateur",
    totalSlides: 3,
    name: "Paolo",
    status: "fondateur de Financia",
    hookQuote: "Je suis parti de zéro, sans personne pour me conseiller — à part un conseiller bancaire assez limité.",
    parcoursTitle: "Son parcours",
    paragraphs: [
      "J’ai ouvert mon PEA en février 2025, puis une assurance-vie, avec des versements réguliers sur les deux.",
      "ETF et actions diverses au départ, en DCA. Avec le temps, j’ai recentré mon portefeuille sur un ETF monde — pour capitaliser sur le temps long.",
      "Plus d’un an d’investissement m’a appris à comprendre les niveaux de risque et les stratégies possibles, en apprenant seul.",
    ],
    lessonTitle: "Pourquoi Financia",
    lessonQuote: "Je veux transmettre ce que j’ai appris aux jeunes encore dans leur phase de réflexion — ceux qui s’interrogent sur la sécurité et les perspectives de leurs investissements.",
    ctaText: "Toi aussi, raconte-nous ton parcours → en DM 💬",
    followText: "Suis @financia_cloud",
    disclaimer: "Ceci n’est pas un conseil en investissement",
  };
</script>

<div class="stage">
  <div class="slide" id="slide2">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <div class="header">
      <div class="header-left">
        <div class="logo">FINANCIA</div>
        <div class="badge-temoignage" id="badgeNum">TÉMOIGNAGE</div>
      </div>
      <div class="slide-num" id="slideNum">2/3</div>
    </div>

    <h1 class="s-title" id="parcoursTitle"></h1>
    <div class="parcours-list" id="parcoursList"></div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  var SLIDE_INDEX = 2; // position de CE fichier dans la story (1, 2, 3...)
  document.getElementById('badgeNum').textContent = CONTENT.badge || ('TÉMOIGNAGE #' + CONTENT.number);
  document.getElementById('slideNum').textContent = SLIDE_INDEX + '/' + CONTENT.totalSlides;
  document.getElementById('parcoursTitle').textContent = CONTENT.parcoursTitle;

  var list = document.getElementById('parcoursList');
  CONTENT.paragraphs.forEach(function (text) {
    var item = document.createElement('div');
    item.className = 'parcours-item';
    var bar = document.createElement('div');
    bar.className = 'parcours-bar';
    var p = document.createElement('p');
    p.className = 'parcours-text';
    p.textContent = text;
    item.appendChild(bar);
    item.appendChild(p);
    list.appendChild(item);
  });

  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
