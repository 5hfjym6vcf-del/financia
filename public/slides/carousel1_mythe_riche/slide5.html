<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>slide5 — Le vrai risque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  /* Centers and scales the fixed 1080x1080 canvas to fit any real screen */
  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 100px 80px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 72px 72px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 560px; height: 560px;
    top: -200px; right: -180px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 480px; height: 480px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .slide > * { position: relative; z-index: 1; }

  /* Header */
  .header {
    position: absolute;
    top: 52px;
    left: 72px;
    right: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .logo {
    font-size: 32px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 1.5px;
  }
  .slide-num {
    font-size: 25px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.5px;
  }

  /* Footer */
  .footer {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  /* Hook (centered) */
  .hook-emoji { font-size: 120px; margin-bottom: 32px; line-height: 1; text-align: center; }
  h1 {
    font-size: 68px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.14;
    letter-spacing: -1.6px;
    margin-bottom: 26px;
  }
  h1 em { color: #7C3AED; font-style: normal; }
  h1.strike { text-decoration: line-through; text-decoration-thickness: 5px; text-decoration-color: rgba(255,255,255,0.5); }
  .subtitle {
    font-size: 34px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.42;
    max-width: 820px;
  }
  .subtitle2 {
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    text-align: center;
    line-height: 1.4;
    max-width: 760px;
    margin-top: 14px;
  }

  /* Left-aligned section title */
  .s-title {
    font-size: 56px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1.4px;
    line-height: 1.14;
    margin-bottom: 40px;
  }
  .s-title .accent { color: #7C3AED; }

  /* Body paragraph */
  .lesson-body {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.48;
  }
  .lesson-body strong { color: #fff; font-weight: 800; }
  .lesson-body .accent { color: #7C3AED; font-weight: 800; }

  /* Big violet number */
  .big-num {
    font-size: 108px;
    font-weight: 900;
    color: #7C3AED;
    letter-spacing: -2px;
    line-height: 1;
    margin: 20px 0 8px;
  }
  .big-num-label {
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
  }

  /* Reason / bullet list */
  .reason-list { width: 100%; display: flex; flex-direction: column; gap: 26px; }
  .reason-item { display: flex; align-items: flex-start; gap: 22px; }
  .reason-num { font-size: 30px; font-weight: 800; color: #7C3AED; min-width: 44px; flex-shrink: 0; }
  .reason-text { font-size: 34px; font-weight: 500; color: rgba(255,255,255,0.82); line-height: 1.4; }
  .reason-text strong { color: #7C3AED; font-weight: 800; }

  /* Quote / callout box */
  .quote-box {
    width: 100%;
    margin-top: 40px;
    border-left: 6px solid #7C3AED;
    padding: 30px 34px;
    background: rgba(124,58,237,0.1);
    border-radius: 0 16px 16px 0;
  }
  .quote-box p { font-size: 34px; font-weight: 600; color: #c4b5fd; line-height: 1.42; }
  .quote-box strong { color: #fff; font-weight: 800; }

  /* Compare cards (two-scenario slides) */
  .compare-grid { width: 100%; display: flex; flex-direction: column; gap: 22px; }
  .compare-card {
    width: 100%;
    background: rgba(255,255,255,0.035);
    border: 1.5px solid rgba(124,58,237,0.25);
    border-radius: 18px;
    padding: 28px 30px;
  }
  .compare-label { font-size: 26px; font-weight: 600; color: rgba(255,255,255,0.55); margin-bottom: 10px; }
  .compare-num { font-size: 54px; font-weight: 900; color: #7C3AED; letter-spacing: -1px; margin-bottom: 6px; }
  .compare-sub { font-size: 24px; font-weight: 500; color: rgba(255,255,255,0.4); }
  .compare-vs {
    align-self: center;
    font-size: 24px;
    font-weight: 800;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
  }

  /* Note badge */
  .note-badge {
    margin-top: 36px;
    width: 100%;
    background: rgba(124,58,237,0.1);
    border: 1.5px solid rgba(124,58,237,0.4);
    border-radius: 18px;
    padding: 26px 32px;
    font-size: 28px;
    font-weight: 600;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.4;
  }
  .warn-badge {
    margin-top: 28px;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 24px 30px;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    text-align: center;
    line-height: 1.4;
  }

  /* Year badge (carousel 3) */
  .year-badge {
    font-size: 84px;
    font-weight: 900;
    color: #7C3AED;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 22px;
  }

  /* CTA / conclusion */
  .s-body {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    text-align: center;
    line-height: 1.46;
    max-width: 820px;
    margin-bottom: 44px;
  }
  .s-body strong { color: #fff; font-weight: 700; }

  .cta-badge {
    width: 100%;
    background: rgba(124,58,237,0.18);
    border: 1.5px solid rgba(124,58,237,0.5);
    border-radius: 22px;
    padding: 34px 36px;
    font-size: 36px;
    font-weight: 700;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 30px;
  }
  .cta-badge span { color: #fff; }

  .cta-sub {
    font-size: 30px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    text-align: center;
    margin-bottom: 30px;
  }
  .cta-sub .accent { color: #7C3AED; font-weight: 800; }

  .disclaimer {
    font-size: 23px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.32);
    text-align: center;
    max-width: 760px;
  }

</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide5">
    <div class="glow-orb orb-top-right"></div>
    <div class="glow-orb orb-bottom-left"></div>

    <div class="header">
      <div class="logo">FINANCIA</div>
      <div class="slide-num">5/6</div>
    </div>

    <p class="s-title">Le vrai risque ?</p>
    <p class="lesson-body">Ce n'est pas d'investir 50€.<br>C'est de laisser dormir ton épargne 40 ans pendant que l'<strong>inflation la grignote</strong>.</p>
    <div class="big-num">-33%</div>
    <div class="big-num-label">1 000€ aujourd'hui ne vaudront plus que ~673€ de pouvoir d'achat dans 20 ans (à 2%/an d'inflation).</div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
