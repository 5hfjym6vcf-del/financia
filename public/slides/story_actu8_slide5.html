<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>story_actu8_slide5 — CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 200px 100px 160px;
  }

  .slide-num {
    position: absolute;
    top: 64px;
    right: 70px;
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    letter-spacing: -1px;
    line-height: 1.4;
    max-width: 780px;
  }

  .footer5 {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .footer5-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .footer5-logo { font-size: 24px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 2px; }
  .footer5-link { font-size: 19px; font-weight: 600; color: #c4b5fd; }
  .footer5-source { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.3); }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide5">
    <div class="slide-num">5/5</div>

    <p class="title">Abonne-toi à @financia_cloud pour suivre l'actu 📈</p>

    <div class="footer5">
      <div class="footer5-brand">
        <div class="footer5-logo">FINANCIA</div>
        <div class="footer5-link">🔗 Lien en bio</div>
      </div>
      <div class="footer5-source">Source : Reuters/NYT, 11 août 2026</div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
