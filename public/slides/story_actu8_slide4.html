<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>story_actu8_slide4 — L'ampleur</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 200px 100px 160px;
  }

  .slide-num {
    position: absolute;
    top: 64px;
    right: 70px;
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
    z-index: 2;
  }

  .source-footer {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.2px;
    z-index: 2;
  }

  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    font-size: 128px;
    font-weight: 900;
    color: rgba(255,255,255,0.05);
    text-align: center;
    line-height: 1.05;
    white-space: nowrap;
    z-index: 0;
    user-select: none;
  }

  .content-wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    font-size: 48px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    letter-spacing: -1px;
    margin-bottom: 48px;
  }

  .body-text {
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    text-align: center;
    line-height: 1.5;
    max-width: 820px;
  }
  .body-text strong { color: #c4b5fd; font-weight: 800; }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide4">
    <div class="slide-num">4/5</div>

    <div class="watermark">500 Md$<br>500 Md$<br>500 Md$</div>

    <div class="content-wrap">
      <h2 class="title">L'ampleur</h2>
      <p class="body-text">Un des <strong>plus gros financements privés</strong> jamais montés dans la tech.</p>
    </div>

    <div class="source-footer">Source : Reuters/NYT, 11 août 2026</div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
