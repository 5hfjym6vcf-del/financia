<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>carousel_jeunesinvest_slide5 — CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 110px 90px;
  }

  .slide-num {
    position: absolute;
    top: 56px;
    right: 64px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 46px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
  }
  .footer-logo { font-size: 22px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 2px; }
  .footer-logo .handle { color: rgba(255,255,255,0.3); font-weight: 600; letter-spacing: 0.3px; margin-left: 10px; }
  .footer-source { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.28); }

  .cta-title {
    font-size: 56px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.28;
    letter-spacing: -1px;
    max-width: 780px;
    margin-bottom: 26px;
  }

  .cta-subtext {
    font-size: 27px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    text-align: center;
    max-width: 620px;
    line-height: 1.5;
    margin-bottom: 64px;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #7C3AED;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    padding: 24px 50px;
    border-radius: 100px;
    box-shadow: 0 0 50px rgba(124,58,237,0.45);
    letter-spacing: -0.2px;
  }
  .cta-button svg { flex-shrink: 0; }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide5">
    <div class="slide-num">5/6</div>

    <h2 class="cta-title">Et toi, tu investis<br>déjà ?</h2>
    <p class="cta-subtext">Découvre comment démarrer sur financia.cloud</p>

    <div class="cta-button">
      Voir le simulateur
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="footer">
      <div class="footer-logo">FINANCIA<span class="handle">@financia_cloud</span></div>
      <div class="footer-source">Source : AMF, 2025</div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
