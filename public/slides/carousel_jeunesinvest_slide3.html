<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>carousel_jeunesinvest_slide3 — Qui sont les nouveaux investisseurs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #000000; font-family: 'Montserrat', sans-serif; }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1080px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at 50% 0%, #121014 0%, #000000 65%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 110px 90px;
  }

  .slide-num {
    position: absolute;
    top: 56px;
    right: 64px;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 46px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px;
  }
  .footer-logo { font-size: 22px; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 2px; }
  .footer-logo .handle { color: rgba(255,255,255,0.3); font-weight: 600; letter-spacing: 0.3px; margin-left: 10px; }
  .footer-source { font-size: 16px; font-weight: 500; color: rgba(255,255,255,0.28); }

  .title {
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.28;
    letter-spacing: -0.8px;
    max-width: 820px;
    margin-bottom: 56px;
  }

  .donut-wrap { position: relative; width: 380px; height: 380px; margin-bottom: 52px; }
  .donut-wrap svg { position: absolute; inset: 0; }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .donut-center .pct { font-size: 92px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -2px; }
  .donut-center .pct-label { font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.5); margin-top: 12px; text-align: center; max-width: 210px; line-height: 1.35; }

  .legend { display: flex; gap: 44px; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.72); }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .legend-dot.violet { background: #7C3AED; }
  .legend-dot.gray { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide3">
    <div class="slide-num">3/6</div>

    <h2 class="title">Qui sont les nouveaux<br>investisseurs ?</h2>

    <div class="donut-wrap">
      <svg viewBox="0 0 400 400" width="380" height="380">
        <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="46" />
        <circle cx="200" cy="200" r="160" fill="none" stroke="#7C3AED" stroke-width="46" stroke-linecap="round"
          stroke-dasharray="603.19 1005.31" stroke-dashoffset="0" transform="rotate(-90 200 200)" />
      </svg>
      <div class="donut-center">
        <div class="pct">60%</div>
        <div class="pct-label">ont moins de 30 ans</div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot violet"></span>Moins de 30 ans</div>
      <div class="legend-item"><span class="legend-dot gray"></span>Autres tranches d'âge</div>
    </div>

    <div class="footer">
      <div class="footer-logo">FINANCIA</div>
      <div class="footer-source">Source : AMF, 2025</div>
    </div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
</html>
