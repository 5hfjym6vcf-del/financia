<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000000;
    font-family: 'Inter', sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
    background: #000000;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 90px;
  }

  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  .slide > * { position: relative; z-index: 1; }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .orb-top-right {
    width: 620px; height: 620px;
    top: -220px; right: -220px;
    background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 70%);
  }
  .orb-bottom-left {
    width: 520px; height: 520px;
    bottom: -160px; left: -160px;
    background: radial-gradient(circle, rgba(124,58,237,0.1) 0%, transparent 70%);
  }

  .header {
    position: absolute;
    top: 64px;
    left: 80px;
    right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .logo { font-size: 36px; font-weight: 800; color: #7C3AED; letter-spacing: 1.5px; }
  .slide-num { font-size: 28px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.5px; }

  .footer {
    position: absolute;
    bottom: 56px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.32);
    letter-spacing: 0.3px;
    z-index: 2;
  }

  .hook-emoji { font-size: 150px; margin-bottom: 44px; line-height: 1; text-align: center; }
  h1 {
    font-size: 76px;
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.12;
    letter-spacing: -2px;
    margin-bottom: 32px;
  }
  h1 em { color: #7C3AED; font-style: normal; }
  .subtitle {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.45;
    max-width: 820px;
  }

  .s-title {
    font-size: 66px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1.6px;
    line-height: 1.14;
    margin-bottom: 48px;
  }

  .reason-list { width: 100%; display: flex; flex-direction: column; gap: 32px; }
  .reason-item { display: flex; align-items: flex-start; gap: 26px; }
  .reason-num { font-size: 34px; font-weight: 800; color: #7C3AED; min-width: 50px; flex-shrink: 0; }
  .reason-text { font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.82); line-height: 1.42; }
  .reason-text strong { color: #7C3AED; font-weight: 800; }

  .lesson-body {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.5;
  }

  .quote-box {
    width: 100%;
    margin-top: 48px;
    border-left: 6px solid #7C3AED;
    padding: 36px 40px;
    background: rgba(124,58,237,0.1);
    border-radius: 0 18px 18px 0;
    text-align: center;
  }
  .quote-box p { font-size: 38px; font-weight: 700; color: #c4b5fd; line-height: 1.4; }
  .quote-box strong { color: #fff; font-weight: 800; }

  .note-badge {
    margin-top: 52px;
    width: 100%;
    background: rgba(124,58,237,0.1);
    border: 1.5px solid rgba(124,58,237,0.4);
    border-radius: 20px;
    padding: 32px 40px;
    font-size: 34px;
    font-weight: 600;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.4;
  }

  .stat-rows { width: 100%; display: flex; flex-direction: column; gap: 0; }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .stat-row:first-child { border-top: 1px solid rgba(255,255,255,0.1); }
  .stat-label { font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.78); }
  .stat-val { font-size: 42px; font-weight: 800; color: #7C3AED; }

  .s-body {
    font-size: 40px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    text-align: center;
    line-height: 1.5;
    max-width: 840px;
    margin-bottom: 64px;
  }
  .s-body strong { color: #fff; font-weight: 700; }

  .cta-badge {
    width: 100%;
    background: rgba(124,58,237,0.18);
    border: 1.5px solid rgba(124,58,237,0.5);
    border-radius: 24px;
    padding: 40px 44px;
    font-size: 40px;
    font-weight: 700;
    color: #c4b5fd;
    text-align: center;
    line-height: 1.45;
    margin-bottom: 48px;
  }
  .cta-badge span { color: #fff; }

  .disclaimer {
    font-size: 26px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.32);
    text-align: center;
  }

</style>
</head>
<body>

<div class="stage">
  <div class="slide" id="slide3">

    <div class="header">
      <div class="logo">FINANCIA</div>
      <div class="slide-num">3/6</div>

    <div class="footer">@financia_cloud</div>
  </div>
</div>

<script>
  function fitStage() {
    var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    document.querySelector('.slide').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>

</body>
