<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Financia — Story Instagram #1 — Bienvenue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      min-height: 100vh;
    }

    .story {
      width: 1080px;
      height: 1920px;
      background: #0A0A0A;
      color: #fff;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 96px;
    }

    /* Grid background */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* Glow central */
    .glow {
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.16) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Glow haut */
    .glow-top {
      position: absolute;
      width: 600px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(124,58,237,0.1) 0%, transparent 70%);
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    /* ── Logo ── */
    .logo {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1.5px;
      white-space: nowrap;
      z-index: 2;
    }
    .logo span { color: #7C3AED; }

    /* ── Handle bas ── */
    .handle {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.04em;
      z-index: 2;
      white-space: nowrap;
    }

    /* ── Contenu central ── */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    /* Pill tag */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.35);
      color: #a78bfa;
      font-size: 24px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 100px;
      margin-bottom: 60px;
    }

    /* Titre */
    .title {
      font-size: 90px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -3.5px;
      color: #fff;
      margin-bottom: 40px;
    }

    .title em { font-style: normal; color: #7C3AED; }

    /* Sous-titre */
    .subtitle {
      font-size: 34px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
      max-width: 800px;
      margin-bottom: 80px;
      letter-spacing: -0.3px;
    }

    /* Séparateur */
    .divider {
      width: 80px;
      height: 3px;
      background: #7C3AED;
      border-radius: 2px;
      margin-bottom: 80px;
    }

    /* Points */
    .points {
      display: flex;
      flex-direction: column;
      gap: 32px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 100px;
    }

    .point {
      display: flex;
      align-items: center;
      gap: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 36px 44px;
    }

    .point-star {
      font-size: 28px;
      color: #7C3AED;
      flex-shrink: 0;
      font-weight: 900;
    }

    .point-text {
      font-size: 34px;
      font-weight: 700;
      color: rgba(255,255,255,0.82);
      letter-spacing: -0.3px;
    }

    /* Bouton */
    .btn {
      background: #7C3AED;
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      padding: 36px 80px;
      border-radius: 100px;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    /* Lien bio */
    .bio-link {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
<div class="story" id="story">
  <div class="grid-bg"></div>
  <div class="glow-top"></div>
  <div class="glow"></div>

  <div class="logo">Financi<span>a</span></div>

  <div class="content">
    <div class="pill">✦ Nouveau compte</div>

    <h1 class="title">Bienvenue<br>sur <em>Financia</em> 👋</h1>

    <p class="subtitle">Le site 100% gratuit pour apprendre<br>à investir quand on a 20 ans.</p>

    <div class="divider"></div>

    <div class="points">
      <div class="point">
        <div class="point-star">✦</div>
        <div class="point-text">Simulateur d'investissement</div>
      </div>
      <div class="point">
        <div class="point-star">✦</div>
        <div class="point-text">Quiz personnalisé</div>
      </div>
      <div class="point">
        <div class="point-star">✦</div>
        <div class="point-text">Modules pédagogiques</div>
      </div>
    </div>

    <div class="btn">Visiter financia.cloud</div>
    <div class="bio-link">🔗 Lien dans la bio</div>
  </div>

  <div class="handle">@financia_cloud</div>
</div>
</body>
</html>
