<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Financia">
  <!-- Pastille de navbar : même objet que l'icône d'application, en petit.
       Le F est dessiné sur grille entière (fûts 4 px, barres 4 px, médiane à
       75 % du haut) et porte crispEdges, pour que chaque bord tombe sur une
       limite de pixel. La pastille, elle, ne le porte PAS : crispEdges sur un
       rect arrondi crénellerait les coins. -->
  <rect width="32" height="32" rx="7" fill="#7C3AED"/>
  <g shape-rendering="crispEdges" fill="#0A0A0B">
    <rect x="8" y="6" width="4" height="20"/>
    <rect x="8" y="6" width="16" height="4"/>
    <rect x="8" y="14" width="12" height="4"/>
  </g>
</svg>
